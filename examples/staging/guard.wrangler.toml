name = "leak-fence-validation-guard"
main = "../../crates/worker/build/worker/shim.mjs"
compatibility_date = "2026-10-08"
workers_dev = false
preview_urls = false

[vars]
SERVICE_ENABLED = "true"
POLICIES_JSON = '[{"id":"sample.customers","budget_group":"customer-read","permission":"customer:read","fields":["id","tenant_id","name"],"tenant_field":"tenant_id","id_field":"id","max_records":10,"max_bytes":16384,"daily_records":120,"daily_bytes":262144}]'

[limits]
cpu_ms = 100

[[durable_objects.bindings]]
name = "BUDGETS"
class_name = "DisclosureBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DisclosureBudget"]

[observability]
enabled = false
