name = "leak-fence-zt-validation-guard"
main = "../../crates/worker/build/worker/shim.mjs"
compatibility_date = "2026-10-08"
workers_dev = false
preview_urls = false

[vars]
SERVICE_ENABLED = "true"
POLICIES_JSON = '[{"id":"zt.verification-summary","budget_group":"zt-verification-summary","permission":"verification-event-summary:read","fields":["schema_version","ingest_id","tenant_id","kind","received_at","reported_result","reported_policy_decision","event_signature_verified"],"tenant_field":"tenant_id","id_field":"ingest_id","max_records":1,"max_bytes":4096,"daily_records":30,"daily_bytes":122880}]'

[limits]
cpu_ms = 100

[[durable_objects.bindings]]
name = "BUDGETS"
class_name = "DisclosureBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DisclosureBudget"]

[observability]
enabled = false
