name: Dependency security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '24 19 * * *'
permissions:
  contents: read
jobs:
  osv-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.9.0'
          package-manager-cache: false
      - name: Install OSV-Scanner
        run: |
          scanner="$RUNNER_TEMP/osv-scanner"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64 \
            --output "$scanner"
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $scanner" | sha256sum --check
          chmod +x "$scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan npm and Cargo lockfiles
        run: node scripts/scan-dependencies.mjs source
      - name: Scan PostgreSQL validation image
        if: success() || failure()
        run: node scripts/scan-dependencies.mjs image
