name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Rust checks
        run: |
          cargo fmt --all --check
          cargo test --locked -p leak-fence-core
          cargo clippy --locked -p leak-fence-core --all-targets -- -D warnings
          cargo clippy --locked -p leak-fence-worker --target wasm32-unknown-unknown -- -D warnings
      - name: Install local tooling
        run: |
          npm ci --ignore-scripts
          cargo install worker-build --version 0.8.7 --locked
      - name: Integration and dependency checks
        run: |
          npm audit --audit-level=high
          npm run check:adapter
          npm run build
          npm run test:worker
          npm run test:staging
          python -B -m unittest discover -s tests -p 'test_*.py' -v
